name: Release (live server)

# Every Versus release is published on the game's own update server first (the game updates itself from it).
# This mirrors that release here: once an hour it reads the server's public update manifest and, when that
# version has no GitHub release yet, downloads the package, checks it (size, SHA-256, mod id and version, the
# platforms inside) and publishes it as the latest release with that version's patch notes.
# Nothing in the repository itself changes.

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/release.yml"]

permissions:
  contents: write

concurrency:
  group: live-release
  cancel-in-progress: false

env:
  ORIGIN: https://54.180.43.196

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Read the live release
        id: live
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 15 --max-time 30 "$ORIGIN/updates/public/manifest.json" -o manifest.json
          python3 - <<'PY'
          import json, os, re
          m = json.load(open("manifest.json"))
          version = m.get("version", "")
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              raise SystemExit(f"unexpected version {version!r}")
          if m.get("modId") != "tipp7.versus" or m.get("channel") != "public":
              raise SystemExit("not the public Versus manifest")
          url = m.get("url", "")
          if url != f"{os.environ['ORIGIN']}/updates/public/releases/{version}/tipp7.versus.geode":
              raise SystemExit(f"unexpected package URL {url!r}")
          sha = m.get("sha256", "")
          if not re.fullmatch(r"[0-9a-f]{64}", sha):
              raise SystemExit("unexpected SHA-256")
          size = int(m.get("size", 0))
          if not 1024 <= size <= 128 * 1024 * 1024:
              raise SystemExit(f"unexpected size {size}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"version={version}\nurl={url}\nsha256={sha}\nsize={size}\n")
          print(f"live release: {version} ({size} bytes)")
          PY

      - name: Published already?
        id: known
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.live.outputs.version }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "$TAG is published already."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download and check the package
        if: steps.known.outputs.found == 'false'
        env:
          URL: ${{ steps.live.outputs.url }}
          SHA: ${{ steps.live.outputs.sha256 }}
          SIZE: ${{ steps.live.outputs.size }}
          VERSION: ${{ steps.live.outputs.version }}
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 15 --max-time 900 "$URL" -o tipp7.versus.geode
          test "$(stat -c %s tipp7.versus.geode)" = "$SIZE"
          echo "$SHA  tipp7.versus.geode" | sha256sum -c -
          python3 - <<'PY'
          import json, os, zipfile
          version = os.environ["VERSION"]
          with zipfile.ZipFile("tipp7.versus.geode") as z:
              if z.testzip() is not None:
                  raise SystemExit("damaged package")
              meta = json.loads(z.read("mod.json"))
              names = set(z.namelist())
          if meta.get("id") != "tipp7.versus" or meta.get("version", "").removeprefix("v") != version:
              raise SystemExit("mod.json does not match the manifest")
          platforms = (("tipp7.versus.dll", "Windows"), ("tipp7.versus.dylib", "macOS"),
                       ("tipp7.versus.ios.dylib", "iOS"), ("tipp7.versus.android32.so", "Android (32-bit)"),
                       ("tipp7.versus.android64.so", "Android (64-bit)"))
          have = [label for name, label in platforms if name in names]
          if "Windows" not in have:
              raise SystemExit("no Windows binary in the package")
          gd = sorted(set((meta.get("gd") or {}).values()))
          with open("package.json", "w") as f:
              json.dump({"platforms": have, "geode": meta.get("geode", ""), "gd": gd}, f)
          print("platforms:", ", ".join(have))
          PY

      - name: Release notes
        if: steps.known.outputs.found == 'false'
        env:
          VERSION: ${{ steps.live.outputs.version }}
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 15 --max-time 30 "$ORIGIN/versus-v1/patchnotes.json" -o notes.json \
            || echo '{}' > notes.json
          python3 - <<'PY'
          import json, os
          version = os.environ["VERSION"]
          package = json.load(open("package.json"))
          try:
              notes = json.load(open("notes.json"))
          except ValueError:
              notes = {}

          def section(text):
              """This version's part of the in-game patch notes (they keep the last few versions)."""
              head = f"# Versus {version}\n"
              if not isinstance(text, str) or not text.startswith(head):
                  return ""
              body = text[len(head):]
              end = body.find("\n# Versus ")
              return (body if end < 0 else body[:end]).strip()

          lines = [
              f"**Download `tipp7.versus.geode`** below and put it in Geometry Dash's Geode mods folder "
              f"(`geode/mods`). Versus keeps itself up to date after that.",
              "",
              f"- Platforms: {', '.join(package['platforms'])}",
              f"- Geometry Dash {', '.join(package['gd'])} with Geode {package['geode']} or newer",
              "- The \"Source code\" archives GitHub adds to every release are this repository's files, not the mod.",
              "",
          ]
          english, korean = section(notes.get("en")), section(notes.get("ko"))
          if english:
              lines += ["## Patch notes", "", english.replace("\n## ", "\n### "), ""]
          if korean:
              lines += ["<details><summary>한국어 패치노트</summary>", "", korean.replace("\n## ", "\n### "), "",
                        "</details>", ""]
          open("notes.md", "w").write("\n".join(lines))
          print("\n".join(lines))
          PY

      - name: Publish
        if: steps.known.outputs.found == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.live.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v$VERSION" tipp7.versus.geode --repo "$GITHUB_REPOSITORY" \
            --title "Versus v$VERSION" --notes-file notes.md --latest
